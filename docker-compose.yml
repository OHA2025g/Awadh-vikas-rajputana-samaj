services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arvs
      POSTGRES_PASSWORD: arvs
      POSTGRES_DB: arvs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arvs -d arvs']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://arvs:arvs@postgres:5432/arvs
      DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
